
<div id="scroll-indicator">
  <div class="scroll-mouse">
    <div class="scroll-wheel"></div>
  </div>
  <div class="scroll-text">SCROLL DOWN</div>
</div>

<style>
  #scroll-indicator {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.5s ease,
                transform 0.5s ease;
  }

  /* Mouse outline */
  .scroll-mouse {
    width: 25px;
    height: 42px;
    border: 2px solid #ffffff;
    border-radius: 16px;
    position: relative;
    box-sizing: border-box;
  }

  /* Animated mouse wheel */
  .scroll-wheel {
    width: 3px;
    height: 7px;
    background: #ffffff;
    border-radius: 5px;
    position: absolute;
    top: 7px;
    left: 50%;
    transform: translateX(-50%);
    animation: mouseScroll 1.5s infinite ease-in-out;
  }

  /* Scroll text */
  .scroll-text {
    font-family: Arial, sans-serif;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 2px;
    color: #ffffff;
    text-align: center;
    white-space: nowrap;
    opacity: 0.9;
  }

  /* Animation */
  @keyframes mouseScroll {
    0% {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    70% {
      opacity: 0;
      transform: translate(-50%, 13px);
    }
    100% {
      opacity: 0;
      transform: translate(-50%, 13px);
    }
  }

  /* Hide after scrolling */
  #scroll-indicator.hidden {
    opacity: 0;
    transform: translate(-50%, 15px);
    visibility: hidden;
  }

  /* Mobile adjustment */
  @media (max-width: 600px) {
    #scroll-indicator {
      bottom: 18px;
    }

    .scroll-mouse {
      width: 23px;
      height: 38px;
    }
  }

  /* Accessibility */
  @media (prefers-reduced-motion: reduce) {
    .scroll-wheel {
      animation: none;
    }
  }
</style>

<script>
(function () {
  const indicator = document.getElementById(
    'scroll-indicator'
  );

  if (!indicator) return;

  function checkScroll() {
    if (window.scrollY > 50) {
      indicator.classList.add('hidden');
    } else {
      indicator.classList.remove('hidden');
    }
  }

  window.addEventListener(
    'scroll',
    checkScroll,
    { passive: true }
  );

  checkScroll();
})();
</script>
